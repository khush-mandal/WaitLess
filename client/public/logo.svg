<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wl-title">
  <title id="wl-title">WaitLess logo</title>
  <defs>
    <linearGradient id="wl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C3CE9"/>
      <stop offset="100%" stop-color="#12D6C4"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="92" height="92" rx="24" fill="#181233"/>
  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#wl-grad)" fill-opacity="0.14"/>
  <!-- hourglass silhouette: two triangles meeting at the waist, doubling as a downward-trend arrow -->
  <path d="M28 26 H68 L50 47 Z" fill="url(#wl-grad)"/>
  <path d="M28 70 H68 L50 49 Z" fill="url(#wl-grad)" fill-opacity="0.45"/>
  <!-- live pulse crossing the waist -->
  <path d="M22 48 H40 L44 40 L50 56 L54 48 H74" fill="none" stroke="#12D6C4" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="74" cy="48" r="3.4" fill="#12D6C4"/>
</svg>
